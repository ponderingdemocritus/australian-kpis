[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/au-kpis-web.Dockerfile"
watchPatterns = [
  "/.npmrc",
  "/apps/web/**",
  "/infra/docker/au-kpis-web.Dockerfile",
  "/package.json",
  "/packages/sdk/**",
  "/packages/sdk-generated/**",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/tsconfig.base.json",
  "/turbo.json",
  "/infra/railway/web.toml",
]

[deploy]
region = "asia-southeast1-eqsg3a"
numReplicas = 2
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30

[deploy.limitOverride.containers]
cpu = 1
memoryBytes = 1073741824
