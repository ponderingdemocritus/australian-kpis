[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/au-kpis-webhook-worker.Dockerfile"
watchPatterns = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/crates/**",
  "/infra/docker/au-kpis-webhook-worker.Dockerfile",
  "/infra/migrations/**",
  "/infra/railway/webhook-worker.toml",
  "/rust-toolchain.toml",
]

[deploy]
region = "asia-southeast1-eqsg3a"
numReplicas = 2
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30

[deploy.limitOverride.containers]
cpu = 1
memoryBytes = 1073741824
