[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/au-kpis-webhook-worker.Dockerfile"
watchPatterns = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/crates/**",
  "/infra/docker/au-kpis-webhook-worker.Dockerfile",
  "/infra/migrations/**",
  "/infra/railway/webhook-worker.toml",
  "/rust-toolchain.toml",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30
