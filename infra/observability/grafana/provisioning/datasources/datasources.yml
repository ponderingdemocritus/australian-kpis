apiVersion: 1

datasources:
  - name: Prometheus
    uid: au-kpis-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: au-kpis-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Tempo
    uid: au-kpis-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: au-kpis-loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: au-kpis-prometheus
