global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: slack-and-pagerduty
  routes:
    - matchers:
        - severity="page"
      receiver: slack-and-pagerduty

receivers:
  - name: slack-and-pagerduty
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "__SLACK_CHANNEL__"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}: {{ .CommonLabels.severity }}"
        text: "{{ .CommonAnnotations.description }}"
    pagerduty_configs:
      - routing_key: "__PAGERDUTY_ROUTING_KEY__"
        severity: critical
        send_resolved: true
        description: "{{ .CommonAnnotations.summary }}"
