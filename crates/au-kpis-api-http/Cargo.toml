[package]
name = "au-kpis-api-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "axum routes + handlers (library)."

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
arrow-array = "58.3.0" # build RecordBatch values for streamed Parquet responses
arrow-schema = "58.3.0" # define the Arrow schema exported by the Parquet endpoint
async-stream = "0.3" # stream JSON/CSV chunks from sqlx without buffering result pages
au-kpis-auth = { workspace = true }
au-kpis-cache = { workspace = true }
au-kpis-config = { workspace = true }
au-kpis-domain = { workspace = true }
au-kpis-scorecard = { workspace = true }
au-kpis-telemetry = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22" # opaque cursor encoding; std has no base64 codec
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
dhat = { version = "0.3", optional = true }
futures = "0.3" # TryStreamExt over sqlx row streams
http = "1"
hmac = "0.12" # HMAC-SHA256 signatures for webhook deliveries
hex = "0.4" # lowercase signature encoding for webhook headers
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "async", "zstd"] } # encode streamed Parquet responses with zstd and without unused codecs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] } # outbound webhook delivery client
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10" # HMAC-SHA256 digest implementation
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["signal"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
url = "2" # robust query-string decoding for dimensions[region]=AUS filters
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
au-kpis-db = { workspace = true }
au-kpis-error = { workspace = true }
au-kpis-testing = { workspace = true }
criterion.workspace = true
jsonschema = "0.29"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "observations_handler"
harness = false

[[bench]]
name = "parquet_stream"
harness = false

[lints]
workspace = true
