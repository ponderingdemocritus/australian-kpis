[package]
name = "au-kpis-adapter-rba"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RBA statistical tables XLS/CSV adapter."

[dependencies]
async-trait = "0.1"
au-kpis-adapter = { workspace = true }
au-kpis-domain = { workspace = true }
au-kpis-error = { workspace = true }
au-kpis-storage = { workspace = true }
bytes = "1"
calamine = { version = "0.35", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
csv-async = { version = "1.3", default-features = false, features = ["tokio"] }
# Some current RBA CSVs are Windows-1252 despite being served as CSV.
encoding_rs = "0.8"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

[features]
fuzzing = []

[dev-dependencies]
insta = { version = "1", features = ["json"] }
object_store = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
