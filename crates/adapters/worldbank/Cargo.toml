[package]
name = "au-kpis-adapter-worldbank"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World Bank B-READY adapter."

[dependencies]
async-trait = "0.1"
au-kpis-adapter = { workspace = true }
au-kpis-domain = { workspace = true }
au-kpis-error = { workspace = true }
au-kpis-storage = { workspace = true }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
csv-async = { version = "1.3", default-features = false, features = ["tokio"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
bytes = "1"
insta = { version = "1", features = ["json"] }
object_store = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
