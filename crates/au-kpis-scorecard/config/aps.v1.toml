id = "aps"
version = "aps.v1"
label = "Abundance Position Score"
description = "National Australia scorecard combining delivery throughput and policy orientation."
formula = "APS = 100 * T * (0.5 + 0.5 * O)"
license = "Apache-2.0"
attribution = "Derived scorecard configuration maintained by australian-kpis."

[[indicators]]
indicator_id = "housing.approvals"
source_dataflow_id = "abs.building_approvals"
measure_id = "dwellings_approved"
axis = "throughput"
component = "housing"
weight = 0.35
direction = "higher_is_better"
display_label = "Housing approvals"
description = "Monthly dwelling approvals against the APS v1 reference range."
unit = "dwellings"
confidence = "high"
coverage_status = "missing_expected"
cadence = "monthly"

[indicators.dimension_selector]
region = "AUS"
measure = "dwellings_approved"

[indicators.normalization]
worst = 10000.0
best = 25000.0

[indicators.provenance]
source_url = "https://www.abs.gov.au/statistics/industry/building-and-construction/building-approvals-australia"
license = "CC-BY-4.0"
attribution = "Source: Australian Bureau of Statistics"

