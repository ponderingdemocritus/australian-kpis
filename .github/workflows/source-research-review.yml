name: Source Research Review

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: "Optional Source Location Audit workflow run id to reuse"
        required: false
        type: string
      dataflow_id:
        description: "Optional single dataflow id to research from the audit findings"
        required: false
        type: string

concurrency:
  group: source-research-review
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  AU_KPIS_SOURCE_LOCATION_AUDIT_REPORT_PATH: target/source-location-audit/source-location-audit.md
  AU_KPIS_SOURCE_RESEARCH_DIR: target/source-research
  AU_KPIS_SOURCE_REGISTER_PATH: crates/au-kpis-source-register/config/source-register.v1.toml

jobs:
  source-research-review:
    name: Generate source research artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select tracked source-location audit run
        id: audit_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.audit_run_id }}" ]; then
            echo "run_id=${{ inputs.audit_run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(
            gh run list \
              --workflow "Source Location Audit" \
              --branch "${GITHUB_REF_NAME}" \
              --status completed \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")] | .[0].databaseId // empty'
          )"
          if [ -z "${run_id}" ]; then
            echo "No completed Source Location Audit run found for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download tracked source-location audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/source-location-audit
          gh run download "${{ steps.audit_run.outputs.run_id }}" \
            --name source-location-audit \
            --dir target/source-location-audit
          test -f target/source-location-audit/source-location-audit.json

      - name: Read source-location audit status
        id: audit_status
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          report_path = pathlib.Path("target/source-location-audit/source-location-audit.json")
          if not report_path.exists():
              print("status=error")
          else:
              report = json.loads(report_path.read_text())
              print(f"status={report.get('status', 'error')}")
          PY

      - name: Generate bounded research packets
        run: |
          args=()
          if [ -n "${{ inputs.dataflow_id }}" ]; then
            args+=(--dataflow-id "${{ inputs.dataflow_id }}")
          fi
          python tools/source_research.py generate \
            --report target/source-location-audit/source-location-audit.json \
            --register "${AU_KPIS_SOURCE_REGISTER_PATH}" \
            --out "${AU_KPIS_SOURCE_RESEARCH_DIR}" \
            "${args[@]}"

      - name: Validate research packet schema
        run: |
          python tools/source_research.py validate \
            --research-dir "${AU_KPIS_SOURCE_RESEARCH_DIR}"

      - name: Render source research comment
        run: |
          python tools/source_research.py render-comment \
            --research-dir "${AU_KPIS_SOURCE_RESEARCH_DIR}" \
            > "${AU_KPIS_SOURCE_RESEARCH_DIR}/comment.md"

      - name: Upload source research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-research
          path: |
            target/source-location-audit/
            target/source-research/
          if-no-files-found: error
          retention-days: 30

      - name: Fail on source-location audit errors
        if: always()
        run: |
          status="$(python -c 'import json, pathlib; p = pathlib.Path("target/source-location-audit/source-location-audit.json"); print(json.loads(p.read_text()).get("status", "error") if p.exists() else "missing")')"
          if [ "$status" = "error" ]; then
            echo "source-location audit reported error status"
            exit 1
          fi

      - name: Append source research summary to tracked issue
        if: github.ref == 'refs/heads/main' && steps.audit_status.outputs.status != 'error'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')

            const marker = '<!-- source-location-audit:tracked -->'
            const summary = JSON.parse(fs.readFileSync('target/source-research/summary.json', 'utf8'))
            if (summary.artifacts_total === 0) {
              core.info('No actionable source-location findings required research packets.')
              return
            }

            const { owner, repo } = context.repo
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'source-drift',
              per_page: 100,
            })
            const trackedIssue = issues.find((issue) => {
              return !issue.pull_request && issue.body && issue.body.includes(marker)
            })
            if (!trackedIssue) {
              core.warning('No open tracked source-drift issue found; research artifacts were uploaded only.')
              return
            }

            const comment = fs.readFileSync('target/source-research/comment.md', 'utf8')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: trackedIssue.number,
              body: `${comment}\n\nArtifacts: \`source-research\` from ${runUrl}`,
            })
