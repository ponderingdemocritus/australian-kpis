name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_call:
    inputs:
      base_ref:
        description: Base branch used for baseline comparisons.
        required: false
        type: string
        default: main
      merge_queue:
        description: Run merge-queue variants of gates such as staging smoke.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('merge-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: 2G

jobs:
  rust-check:
    name: Rust Compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Compile workspace
        run: cargo check --workspace --locked

  source-governance:
    name: Source Governance Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python governance tooling
        run: python -m pip install "ruff==0.15.20" "mypy==1.20.2"

      - name: Lint source governance Python
        run: ruff check tools/source_research.py tests/source_research

      - name: Typecheck source governance Python
        run: mypy --strict tools/source_research.py

      - name: Run source register unit tests
        run: cargo test -p au-kpis-source-register -- --nocapture

      - name: Validate source register and scheduler contracts
        run: cargo test -p au-kpis-scheduler --test source_register_contract -- --nocapture

      - name: Run source-location audit fixture tests
        run: cargo test -p au-kpis-scheduler --test source_location_audit -- --nocapture

      - name: Run source research schema tests
        run: python -m unittest discover tests/source_research

      - name: Run source research generation fixture
        run: |
          set -euo pipefail
          mkdir -p target/source-research-fixture/out
          cat > target/source-research-fixture/source-location-audit.json <<'JSON'
          {
            "generated_at": "2026-06-29T06:00:00+00:00",
            "register_version": "source-register.v1",
            "findings": [
              {
                "source_id": "asx",
                "dataflow_id": "asx.market_statistics",
                "severity": "warning",
                "current_url": "https://www.asx.com.au/about/market-statistics/historical-market-statistics",
                "evidence": "Fixture warning for checked-in register compatibility.",
                "recommendation": "Review ASX market statistics source evidence."
              }
            ]
          }
          JSON
          python tools/source_research.py generate \
            --report target/source-research-fixture/source-location-audit.json \
            --register crates/au-kpis-source-register/config/source-register.v1.toml \
            --out target/source-research-fixture/out
          python tools/source_research.py validate \
            --research-dir target/source-research-fixture/out

  typescript:
    name: TypeScript Typecheck and Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Typecheck TypeScript packages
        run: pnpm turbo run typecheck --cache-dir=.turbo

      - name: Test TypeScript packages
        run: pnpm turbo run test --cache-dir=.turbo

  sdk-runtime:
    name: SDK Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node
          - bun
          - deno
          - browser
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2

      - name: Set up Chrome
        id: setup-chrome
        if: matrix.runtime == 'browser'
        uses: browser-actions/setup-chrome@v1

      - name: Compile SDK test artifacts
        run: pnpm --filter @au-kpis/sdk exec tsc -b tsconfig.json --pretty false

      - name: Run Node SDK runtime test
        if: matrix.runtime == 'node'
        run: node packages/sdk/dist/client.runtime.test.js

      - name: Run Bun SDK runtime test
        if: matrix.runtime == 'bun'
        run: bun packages/sdk/dist/client.runtime.test.js

      - name: Run Deno SDK runtime test
        if: matrix.runtime == 'deno'
        run: deno run --allow-read --node-modules-dir=auto packages/sdk/dist/client.runtime.test.js

      - name: Run browser SDK runtime test
        if: matrix.runtime == 'browser'
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node packages/sdk/scripts/browser-runtime-check.mjs

  pdf-extractor:
    name: PDF Extractor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Install uv
        run: python -m pip install uv

      - name: Run PDF extractor unit tests
        run: uv run --project apps/pdf-extractor pytest apps/pdf-extractor/tests

      - name: Lint PDF extractor
        run: uv run --project apps/pdf-extractor ruff check apps/pdf-extractor

      - name: Typecheck PDF extractor
        run: uv run --project apps/pdf-extractor mypy --config-file apps/pdf-extractor/pyproject.toml apps/pdf-extractor/src

      - name: Start PDF extractor smoke stack
        run: |
          AU_KPIS_PDF_EXTRACTOR__MAX_PAGES=2 \
            docker compose -f infra/compose/docker-compose.yml up -d --build --wait --wait-timeout 180 minio pdf-extractor

      - name: Seed PDF fixture into MinIO
        run: |
          uv run --project apps/pdf-extractor python - <<'PY'
          from pathlib import Path

          import boto3
          from botocore.exceptions import ClientError

          bucket = "au-kpis-artifacts"
          key = "artifacts/fixtures/bp4-agency-resourcing.pdf"
          fixture = Path("apps/pdf-extractor/tests/fixtures/bp4_agency_resourcing_tables_2026_27.pdf")
          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              region_name="us-east-1",
              aws_access_key_id="au_kpis_minio",
              aws_secret_access_key="au_kpis_minio_dev_password",
          )
          try:
              client.create_bucket(Bucket=bucket)
          except ClientError as err:
              code = err.response.get("Error", {}).get("Code")
              if code not in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                  raise
          client.upload_file(str(fixture), bucket, key)
          PY

      - name: Run PDF extractor k6 smoke
        env:
          AU_KPIS_PDF_BASE_URL: http://127.0.0.1:8010
          AU_KPIS_PDF_S3_KEY: artifacts/fixtures/bp4-agency-resourcing.pdf
        run: k6 run apps/bench/pdf-extractor-smoke.js

      - name: Stop PDF extractor smoke stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  sdk-integration:
    name: SDK Integration (compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Build SDK packages
        run: pnpm turbo run build --filter=@au-kpis/sdk --cache-dir=.turbo

      - name: Start compose stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --build

      - name: Apply migrations
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                pg_isready -U au_kpis -d au_kpis; then
              break
            fi
            sleep 1
          done
          cat infra/migrations/*.up.sql \
            | docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis

      - name: Seed SDK fixture data
        run: |
          set -euo pipefail
          docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis <<'SQL'
          INSERT INTO sources (id, name, homepage, description)
          VALUES ('abs', 'Australian Bureau of Statistics', 'https://www.abs.gov.au', NULL);

          INSERT INTO codelists (id, name, description)
          VALUES ('CL_REGION', 'Regions', NULL);

          INSERT INTO codes (codelist_id, id, name, description, parent_id)
          VALUES ('CL_REGION', 'AUS', 'Australia', NULL, NULL);

          INSERT INTO measures (id, name, description, unit, scale)
          VALUES ('index', 'CPI index', NULL, 'index', NULL);

          INSERT INTO dataflows (
              id, source_id, name, description, dimensions, measures,
              frequency, license, attribution, source_url
          )
          VALUES (
              'abs.cpi', 'abs', 'Consumer Price Index', NULL,
              ARRAY['region'], ARRAY['index'], 'quarterly', 'CC-BY-4.0',
              'Source: Australian Bureau of Statistics',
              'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia'
          );

          INSERT INTO dimensions (dataflow_id, id, name, description, codelist_id, position)
          VALUES ('abs.cpi', 'region', 'Region', NULL, 'CL_REGION', 0);

          INSERT INTO series (
              series_key, dataflow_id, measure_id, dimensions, unit,
              first_observed, last_observed, active
          )
          VALUES (
              decode(repeat('a', 64), 'hex'), 'abs.cpi', 'index',
              '{"region":"AUS"}'::jsonb, 'index',
              '2024-06-01T00:00:00Z', '2024-06-01T00:00:00Z', true
          );

          INSERT INTO artifacts (
              id, source_id, source_url, content_type, response_headers,
              size_bytes, storage_key, fetched_at
          )
          VALUES (
              decode(repeat('b', 64), 'hex'), 'abs',
              'https://example.test/cpi.json', 'application/json',
              '{}'::jsonb, 128, 'artifacts/sdk-compose-fixture',
              '2024-07-24T00:00:00Z'
          );

          INSERT INTO observations (
              series_key, time, revision_no, time_precision, value, status,
              attributes, ingested_at, source_artifact_id
          )
          VALUES (
              decode(repeat('a', 64), 'hex'), '2024-06-01T00:00:00Z', 1,
              'quarter', 136.9, 'normal', '{}'::jsonb,
              '2024-07-24T00:00:00Z', decode(repeat('b', 64), 'hex')
          );
          SQL

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:3000/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/compose/docker-compose.yml logs api >&2 || true
          exit 1

      - name: Run SDK integration
        run: node packages/sdk/scripts/compose-integration.mjs

      - name: Stop compose stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Build web app and dependencies
        run: pnpm turbo run build --filter=@au-kpis/web --cache-dir=.turbo

      - name: Install Playwright browser
        run: pnpm --filter @au-kpis/web exec playwright install --with-deps chromium

      - name: Start compose stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --build

      - name: Apply migrations
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                pg_isready -U au_kpis -d au_kpis; then
              break
            fi
            sleep 1
          done
          cat infra/migrations/*.up.sql \
            | docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis

      - name: Seed Explorer fixture data
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis \
            < apps/web/e2e/fixtures/explorer.sql

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:3000/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/compose/docker-compose.yml logs api >&2 || true
          exit 1

      - name: Run Explorer Playwright suite
        env:
          NEXT_PUBLIC_AU_KPIS_API_BASE_URL: http://127.0.0.1:3000
        run: pnpm --filter @au-kpis/web exec playwright test

      - name: Stop compose stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint TypeScript and Markdown
        run: pnpm run lint

  openapi:
    name: OpenAPI Drift and Breaking Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.15.0

      - name: Generate OpenAPI document
        run: |
          set -euo pipefail
          mkdir -p target/openapi
          cargo run -p au-kpis-openapi > target/openapi/openapi.json

      - name: Check committed OpenAPI is current
        run: |
          set -euo pipefail
          jq -S . openapi.json > target/openapi/committed-normalized.json
          jq -S . target/openapi/openapi.json > target/openapi/generated-normalized.json
          git diff --no-index --exit-code \
            target/openapi/committed-normalized.json \
            target/openapi/generated-normalized.json

      - name: Compare against base branch OpenAPI
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${BASE_REF}"
          git show "origin/${BASE_REF}:openapi.json" > target/openapi/base-openapi.json
          oasdiff breaking target/openapi/base-openapi.json target/openapi/openapi.json

  supply-chain:
    name: Supply Chain and Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check Rust dependency policy
        run: cargo deny check

      - name: Audit Rust advisories
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0111

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level critical

      - name: Scan full repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container-security:
    name: Container Build and Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/au-kpis-api.Dockerfile
          target: runtime
          tags: au-kpis-api:pr
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: au-kpis-api:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  smoke:
    name: Smoke (k6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCAL_K6_OUT: influxdb=http://127.0.0.1:8086/k6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Configure k6 output
        env:
          K6_INFLUXDB_ADDR: ${{ vars.K6_INFLUXDB_ADDR }}
        run: |
          set -euo pipefail
          if [ -n "${K6_INFLUXDB_ADDR:-}" ]; then
            echo "K6_OUT=influxdb=${K6_INFLUXDB_ADDR}" >> "$GITHUB_ENV"
          else
            echo "K6_OUT=${LOCAL_K6_OUT}" >> "$GITHUB_ENV"
          fi

      - name: Configure local smoke target
        if: inputs.merge_queue != true
        run: |
          set -euo pipefail
          echo "AU_KPIS_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "K6_ENVIRONMENT=pr-compose" >> "$GITHUB_ENV"

      - name: Configure staging smoke target
        if: inputs.merge_queue == true
        env:
          AU_KPIS_STAGING_BASE_URL: ${{ vars.AU_KPIS_STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${AU_KPIS_STAGING_BASE_URL:-}" ]; then
            echo "AU_KPIS_STAGING_BASE_URL repository variable is required for merge queue smoke." >&2
            exit 1
          fi
          echo "AU_KPIS_BASE_URL=${AU_KPIS_STAGING_BASE_URL}" >> "$GITHUB_ENV"
          echo "K6_ENVIRONMENT=staging" >> "$GITHUB_ENV"

      - name: Start compose smoke dependencies
        if: inputs.merge_queue != true
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 120 postgres redis minio pdf-extractor influxdb

      - name: Start merge-queue metrics store
        if: inputs.merge_queue == true
        run: docker compose -f infra/compose/docker-compose.yml up -d influxdb

      - name: Apply migrations
        if: inputs.merge_queue != true
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            docker compose -f infra/compose/docker-compose.yml logs postgres >&2 || true
            exit 1
          fi
          cat infra/migrations/*.up.sql \
            | docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis

      - name: Seed smoke fixture data
        if: inputs.merge_queue != true
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis \
            < apps/web/e2e/fixtures/explorer.sql

      - name: Start local smoke API
        if: inputs.merge_queue != true
        run: docker compose -f infra/compose/docker-compose.yml up -d --build api

      - name: Wait for local API readiness
        if: inputs.merge_queue != true
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:3000/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/compose/docker-compose.yml logs api >&2 || true
          exit 1

      - name: Wait for k6 metrics store
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8086/ping" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/compose/docker-compose.yml logs influxdb >&2 || true
          exit 1

      - name: Run k6 smoke scenario
        env:
          AU_KPIS_API_KEY: ${{ secrets.AU_KPIS_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          k6 run --out "${K6_OUT}" \
            --tag environment="${K6_ENVIRONMENT}" \
            --tag github_run_id="${GITHUB_RUN_ID}" \
            apps/bench/smoke.js

      - name: Stop compose smoke stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile observability down -v

  bench:
    name: Bench Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Check workspace bench targets
        run: cargo check --workspace --benches --locked

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Capture benchmark baselines
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          pr_sha="$(git rev-parse HEAD)"
          run_benchmarks() {
            local baseline="$1"
            cargo bench -p au-kpis-domain --bench observation_json --locked -- --save-baseline "${baseline}"
            if [ -f crates/adapters/abs/benches/sdmx_parse.rs ]; then
              cargo bench -p au-kpis-adapter-abs --bench sdmx_parse --locked -- --save-baseline "${baseline}"
            fi
            if [ -f crates/au-kpis-loader/benches/copy_upsert.rs ]; then
              cargo bench -p au-kpis-loader --bench copy_upsert --locked -- --save-baseline "${baseline}"
            fi
            if [ -f crates/au-kpis-api-http/benches/observations_handler.rs ]; then
              cargo bench -p au-kpis-api-http --bench observations_handler --locked -- --save-baseline "${baseline}"
            fi
            if [ -f crates/au-kpis-api-http/benches/parquet_stream.rs ]; then
              cargo bench -p au-kpis-api-http --bench parquet_stream --locked -- --save-baseline "${baseline}"
            fi
          }
          # Measure the PR first so long-running Criterion jobs do not
          # consistently charge runner slowdown to the PR baseline.
          run_benchmarks pr
          git fetch --depth=1 origin "${BASE_REF}"
          git checkout --detach FETCH_HEAD
          run_benchmarks main
          git checkout --detach "${pr_sha}"

      - name: Run benchmark regression comparison
        run: |
          set -euo pipefail
          set +e
          critcmp_output="$(critcmp main pr --threshold 5 --list 2>&1)"
          critcmp_status=$?
          set -e
          printf '%s\n' "${critcmp_output}"
          if [ "${critcmp_status}" -ne 0 ]; then
            echo "critcmp threshold check exited with status ${critcmp_status}; verifying confidence bounds."
          fi
          critcmp --export main > target/criterion-main.json
          critcmp --export pr > target/criterion-pr.json
          python3 <<'PY'
          import json
          import sys

          with open("target/criterion-main.json", encoding="utf-8") as handle:
              main = json.load(handle)["benchmarks"]
          with open("target/criterion-pr.json", encoding="utf-8") as handle:
              pr = json.load(handle)["benchmarks"]

          common = sorted(set(main) & set(pr))
          # These helper timings feed an explicit in-benchmark overhead budget;
          # comparing them against main double-counts the same guard.
          budget_checked = {
              "api_observations/direct_db_observations_page",
              "api_observations/handler_observations_page_under_5ms_above_db",
          }
          common = [name for name in common if name not in budget_checked]
          if not common:
              print("No common Criterion benchmarks to compare.", file=sys.stderr)
              sys.exit(1)

          regressions = []
          for name in common:
              main_estimate = main[name]["criterion_estimates_v1"]["mean"]
              pr_estimate = pr[name]["criterion_estimates_v1"]["mean"]
              main_mean = main_estimate["point_estimate"]
              pr_mean = pr_estimate["point_estimate"]
              main_upper = main_estimate.get("upper_bound", main_mean)
              pr_lower = pr_estimate.get("lower_bound", pr_mean)
              ratio = pr_mean / main_mean
              if ratio > 1.05 and pr_lower > main_upper * 1.05:
                  regressions.append((name, ratio))

          if regressions:
              print("Criterion regressions above 5%:", file=sys.stderr)
              for name, ratio in regressions:
                  print(f"- {name}: {(ratio - 1) * 100:.2f}% slower", file=sys.stderr)
              sys.exit(1)

          print(f"No Criterion regressions above 5% across {len(common)} common benchmark(s).")
          PY

  nextest:
    name: Rust Tests (nextest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.100 --locked

      - name: Run workspace tests with CI profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/nextest
          set +e
          cargo nextest run --workspace --profile ci \
            -E 'not test(loads_ten_thousand_observations_with_copy_batches)' \
            2>&1 | tee target/nextest/ci-run.log
          nextest_status=${PIPESTATUS[0]}
          set -e
          if grep -n "FLAKY" target/nextest/ci-run.log; then
            echo "Flaky retries are not allowed in CI." >&2
            exit 1
          fi
          if [ "${nextest_status}" -ne 0 ]; then
            summary="$(
              grep -E '^(  TRY [0-9]+ FAIL|  FAIL|error:|test .* FAILED|failures:)' \
                target/nextest/ci-run.log \
                | head -80 \
                || true
            )"
            if [ -z "${summary}" ]; then
              summary="$(tail -120 target/nextest/ci-run.log)"
            fi
            printf '%s\n' "${summary}" \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
            exit "${nextest_status}"
          fi

      - name: Enforce ABS streaming memory budgets
        run: |
          cargo test -p au-kpis-adapter-abs \
            --features dhat-heap \
            --test fetch_memory \
            -- --ignored --nocapture
          cargo test -p au-kpis-adapter-abs \
            --features dhat-heap \
            --test parse_memory \
            -- --ignored --nocapture
          cargo test -p au-kpis-api-http \
            --release \
            --features dhat-heap \
            --test parquet_memory \
            -- --ignored --nocapture

  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COVERAGE_RUST_TOOLCHAIN: nightly-2025-10-01
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install nightly Rust toolchain
        run: rustup toolchain install "$COVERAGE_RUST_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.21 --locked

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.100 --locked

      - name: Generate LCOV report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/llvm-cov
          cargo +"$COVERAGE_RUST_TOOLCHAIN" llvm-cov clean --workspace
          set +e
          cargo +"$COVERAGE_RUST_TOOLCHAIN" llvm-cov nextest \
            --workspace \
            --profile ci \
            -E 'not test(loads_ten_thousand_observations_with_copy_batches)' \
            --skip-functions \
            --branch \
            --lcov \
            --output-path target/llvm-cov/lcov.info \
            --fail-under-lines 80 \
            2>&1 | tee target/llvm-cov/ci-run.log
          llvm_cov_status=${PIPESTATUS[0]}
          set -e
          if [ "${llvm_cov_status}" -ne 0 ]; then
            summary="$(
              grep -E '^(  TRY [0-9]+ FAIL|  FAIL|error:|test .* FAILED|failures:)' \
                target/llvm-cov/ci-run.log \
                | head -80 \
                || true
            )"
            if [ -z "${summary}" ]; then
              summary="$(tail -120 target/llvm-cov/ci-run.log)"
            fi
            printf '%s\n' "${summary}" \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
            exit "${llvm_cov_status}"
          fi

      - name: Enforce branch coverage floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          brf = 0
          brh = 0

          for line in Path("target/llvm-cov/lcov.info").read_text().splitlines():
              if line.startswith("BRF:"):
                  brf += int(line[4:])
              elif line.startswith("BRH:"):
                  brh += int(line[4:])

          if brf == 0:
              raise SystemExit("No branch coverage data found in LCOV output")

          branch_coverage = (brh / brf) * 100
          print(f"Total branch coverage: {branch_coverage:.2f}% ({brh}/{brf})")
          if branch_coverage < 70:
              raise SystemExit(
                  f"Branch coverage below threshold: {branch_coverage:.2f}% < 70.00%"
              )
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov.info
          flags: rust
          name: rust-nextest
          use_oidc: true
          fail_ci_if_error: false

  contract:
    name: Contract (schemathesis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Schemathesis
        run: python -m pip install "schemathesis==4.15.2" "jsonschema==4.25.1"

      - name: Start compose contract stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/contract
          AU_KPIS_RATE_LIMITS__ANONYMOUS__PER_SECOND=1000 \
          AU_KPIS_RATE_LIMITS__ANONYMOUS__PER_HOUR=10000 \
          AU_KPIS_RATE_LIMITS__ANONYMOUS__BURST_MULTIPLIER=1 \
            docker compose -f infra/compose/docker-compose.yml up -d --build api

      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                pg_isready -U au_kpis -d au_kpis; then
              break
            fi
            sleep 1
          done
          cat infra/migrations/*.up.sql \
            | docker compose -f infra/compose/docker-compose.yml exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis

      - name: Seed contract fixture data
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U au_kpis -d au_kpis \
            < apps/web/e2e/fixtures/explorer.sql

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:3000/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/compose/docker-compose.yml logs api >&2 || true
          exit 1

      - name: Validate live OpenAPI response
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "http://127.0.0.1:3000/v1/openapi.json" > target/contract/live-openapi.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import Draft202012Validator

          schema = json.loads(
              Path("crates/au-kpis-openapi/tests/fixtures/openapi-3.1-schema.json").read_text()
          )
          document = json.loads(Path("target/contract/live-openapi.json").read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Run Schemathesis
        run: |
          schemathesis --config-file tests/contract/schemathesis.toml run \
            --checks all \
            --exclude-checks positive_data_acceptance \
            --rate-limit 5/s \
            --report junit \
            --report-junit-path target/contract/schemathesis.xml \
            --url "http://127.0.0.1:3000" \
            target/contract/live-openapi.json

      - name: Upload Schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-contract-report
          path: target/contract/schemathesis.xml
          if-no-files-found: ignore

      - name: Stop compose contract stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  snapshots:
    name: Snapshot Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-insta
        run: cargo install cargo-insta --version 1.47.2 --locked

      - name: Verify committed snapshots
        run: |
          cargo insta test --workspace --check -- \
            --skip loads_ten_thousand_observations_with_copy_batches

  codex-review:
    name: Codex Structured Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
      CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT || 'high' }}
      CODEX_REVIEW_BLOCK_ON_INCORRECT: ${{ vars.CODEX_REVIEW_BLOCK_ON_INCORRECT || 'false' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check review preconditions
        id: preflight
        env:
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' && 'true' || 'false' }}
          IS_DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          should_run=true
          reason="ready"

          if [ "$HAS_OPENAI_KEY" != "true" ]; then
            should_run=false
            reason="OPENAI_API_KEY is not configured"
          elif [ "$IS_DRAFT" = "true" ]; then
            should_run=false
            reason="draft pull requests are skipped"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            should_run=false
            reason="fork pull requests do not receive repository secrets"
          fi

          echo "should_run=$should_run" >>"$GITHUB_OUTPUT"
          echo "reason=$reason" >>"$GITHUB_OUTPUT"
          printf 'Codex review %s: %s\n' "$([ "$should_run" = true ] && echo enabled || echo skipped)" "$reason" >>"$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Checkout pull request merge commit
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Fetch base and head refs
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          set -euxo pipefail
          git fetch --no-tags origin \
            "$BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"
        shell: bash

      - name: Build Codex review prompt
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          base_file() {
            local path="$1"
            git show "${BASE_SHA}:${path}"
          }

          current_file() {
            local path="$1"
            cat "$path"
          }

          guide_file() {
            local path="$1"
            if [ -f "$path" ]; then
              current_file "$path"
            elif git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              echo "[Guide was deleted in this PR; showing base version.]"
              base_file "$path"
            else
              echo "[Guide does not exist in base or head.]"
            fi
          }

          current_file ".github/codex/review_prompt.md" >codex-prompt.md
          current_file ".github/codex/output-schema.json" >codex-output-schema.json

          changed_files="$(git --no-pager diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          guide_list_file="$(mktemp)"
          base_agents_file="$(mktemp)"
          base_file "AGENTS.md" >"$base_agents_file"

          print_agents_section() {
            local start_regex="$1"
            local end_regex="$2"
            awk -v start="$start_regex" -v end="$end_regex" '
              $0 ~ end { printing = 0 }
              $0 ~ start { printing = 1 }
              printing { print }
            ' "$base_agents_file"
          }

          review_lenses=""
          case "$changed_files" in
            *crates/au-kpis-db/*|*infra/migrations/*)
              review_lenses="${review_lenses}\n- Database lens: protect hypertable correctness, query safety, reversibility, revision semantics, and observations_latest behavior."
              echo ".github/codex/guides/db.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *crates/au-kpis-loader/*|*crates/au-kpis-ingestion-core/*|*crates/au-kpis-queue/*|*crates/bins/au-kpis-ingestion/*|*crates/bins/au-kpis-scheduler/*)
              review_lenses="${review_lenses}\n- Ingestion lens: protect streaming, idempotency, raw artifact provenance, adapter/DB separation, retry behavior, and revision ordering."
              echo ".github/codex/guides/ingestion.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *crates/au-kpis-adapter/*|*crates/adapters/*|*crates/au-kpis-pdf-client/*)
              review_lenses="${review_lenses}\n- Adapter lens: protect parser correctness, source artifact linkage, format-drift safety, and adapter abstraction boundaries."
              echo ".github/codex/guides/adapters.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *crates/au-kpis-domain/*)
              review_lenses="${review_lenses}\n- Domain lens: protect typed boundaries, schema stability, and the canonical series/observation model."
              echo ".github/codex/guides/domain.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *crates/au-kpis-api-http/*|*crates/au-kpis-openapi/*|*packages/sdk/*|*packages/sdk-generated/*)
              review_lenses="${review_lenses}\n- API lens: protect OpenAPI parity, response compatibility, SDK regeneration expectations, and attribution in outward-facing payloads."
              echo ".github/codex/guides/api-sdk.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *apps/web/*)
              review_lenses="${review_lenses}\n- Frontend lens: protect explorer/client correctness and required E2E plus accessibility coverage."
              echo ".github/codex/guides/frontend.md" >>"$guide_list_file"
              ;;
          esac
          case "$changed_files" in
            *.github/workflows/*|*AGENTS.md|*Spec.md)
              review_lenses="${review_lenses}\n- CI/spec lens: verify that repo policy and documented CI behavior stay aligned."
              echo ".github/codex/guides/ci-spec.md" >>"$guide_list_file"
              ;;
          esac

          sort -u "$guide_list_file" -o "$guide_list_file"

          {
            echo ""
            echo "Repository: ${REPOSITORY}"
            echo "Pull Request #: ${PR_NUMBER}"
            echo "Base ref: ${BASE_REF}"
            echo "Head ref: ${HEAD_REF}"
            echo "Base SHA: ${BASE_SHA}"
            echo "Head SHA: ${HEAD_SHA}"
            echo ""
            echo "Pull request title:"
            printf '%s\n' "${PR_TITLE}"
            echo ""
            echo "Pull request body:"
            printf '%s\n' "${PR_BODY}"
            echo ""
            echo "Detected review lenses:"
            if [ -n "$review_lenses" ]; then
              printf '%b\n' "$review_lenses"
            else
              echo "- General lens: infer subsystem-specific risks from the changed files."
            fi
            echo ""
            echo "Included path-specific guides:"
            if [ -s "$guide_list_file" ]; then
              while IFS= read -r guide_path; do
                echo "- ${guide_path}"
              done <"$guide_list_file"
            else
              echo "- none"
            fi
            echo ""
            echo "Changed files:"
            git --no-pager diff --name-status "${BASE_SHA}" "${HEAD_SHA}"
            echo ""
            echo "Repository policy excerpts from AGENTS.md at base commit ${BASE_SHA}:"
            echo "--- BEGIN AGENTS.md: PR rules ---"
            print_agents_section '^## 7\. PR rules' '^## 8\. CI rules'
            echo "--- END AGENTS.md: PR rules ---"
            echo ""
            echo "--- BEGIN AGENTS.md: testing expectations and agent pitfalls ---"
            print_agents_section '^## 11\. Testing expectations' '^## 13\. When stuck'
            echo "--- END AGENTS.md: testing expectations and agent pitfalls ---"
            echo ""
            if [ -s "$guide_list_file" ]; then
              while IFS= read -r guide_path; do
                echo ""
                echo "--- BEGIN GUIDE: ${guide_path} ---"
                guide_file "$guide_path"
                echo "--- END GUIDE: ${guide_path} ---"
              done <"$guide_list_file"
              echo ""
            fi
            echo "Unified diff (context=5):"
            git --no-pager diff --unified=5 --stat=200 "${BASE_SHA}" "${HEAD_SHA}" > /tmp/diffstat.txt
            git --no-pager diff --unified=5 "${BASE_SHA}" "${HEAD_SHA}" > /tmp/full.diff
            cat /tmp/diffstat.txt
            echo ""
            cat /tmp/full.diff
          } >>codex-prompt.md

          rm -f "$guide_list_file" "$base_agents_file"
        shell: bash

      - name: Run Codex structured review
        if: steps.preflight.outputs.should_run == 'true'
        id: run-codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-prompt.md
          output-schema-file: codex-output-schema.json
          output-file: codex-output.json
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_REVIEW_EFFORT }}
          sandbox: read-only
          safety-strategy: drop-sudo

      - name: Inspect structured Codex output
        if: steps.preflight.outputs.should_run == 'true' && always()
        run: |
          set -euo pipefail

          if [ -s codex-output.json ]; then
            jq '.' codex-output.json
          else
            echo "Codex output file missing"
            if [ "${CODEX_REVIEW_BLOCK_ON_INCORRECT}" = "true" ]; then
              echo "Codex blocking mode is enabled; missing review output fails the job."
              exit 1
            fi
            echo "Codex review is advisory; continuing without review output."
          fi
        shell: bash

      - name: Remove prior Codex review comments
        if: steps.preflight.outputs.should_run == 'true' && always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          inline_comments_url="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100"
          issue_comments_url="https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$inline_comments_url" |
            jq -r '.[] | select(.body | contains("<!-- codex-review-inline -->")) | .id' |
            while IFS= read -r comment_id; do
              curl -fsSL \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/pulls/comments/${comment_id}"
            done

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$issue_comments_url" |
            jq -r '.[] | select(
              (.body | contains("<!-- codex-review-summary -->"))
              or (.body | contains("<!-- codex-review-inline-fallback -->"))
            ) | .id' |
            while IFS= read -r comment_id; do
              curl -fsSL \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/issues/comments/${comment_id}"
            done
        shell: bash

      - name: Publish inline review comments
        if: steps.preflight.outputs.should_run == 'true' && always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_JSON: codex-output.json
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_JSON" ]; then
            echo "No Codex output file present; skipping comment publishing."
            exit 0
          fi

          findings_count=$(jq '.findings | length' "$REVIEW_JSON")
          if [ "$findings_count" -eq 0 ]; then
            echo "Codex returned no findings; skipping inline comments."
            exit 0
          fi

          # Each finding produces a pair of payloads:
          #   .inline   — the standard inline review-comment payload
          #   .fallback — an issue-comment payload posted only when the
          #               inline POST is rejected (typically 422:
          #               "pull_request_review_thread.line could not be
          #               resolved", which happens when Codex points at
          #               a line outside the PR's diff hunks).
          # Emitting both up-front keeps jq out of the retry path.
          jq -c \
            --arg commit "$HEAD_SHA" \
            --arg workspace "${GITHUB_WORKSPACE%/}/" '
            .findings[]
            | (.code_location.absolute_file_path | sub("^" + $workspace; "")) as $relpath
            | (
                "**[" + .category + "][" + .subsystem + "] " + .title + "**\n\n"
                + .body
                + "\n\nInvariant: `" + .invariant + "`"
                + "\nSuggested test layer: `" + .suggested_test_layer + "`"
                + "\nConfidence: " + (.confidence_score | tostring)
                + "\nPriority: P" + (.priority | tostring)
              ) as $core
            | (
                if .code_location.line_range.start == .code_location.line_range.end
                then (.code_location.line_range.end | tostring)
                else (.code_location.line_range.start | tostring) + "-" + (.code_location.line_range.end | tostring)
                end
              ) as $range
            | {
                inline: ({
                  body: ("<!-- codex-review-inline -->\n" + $core),
                  commit_id: $commit,
                  path: $relpath,
                  line: .code_location.line_range.end,
                  side: "RIGHT",
                  start_line: (if .code_location.line_range.start != .code_location.line_range.end then .code_location.line_range.start else null end),
                  start_side: (if .code_location.line_range.start != .code_location.line_range.end then "RIGHT" else null end)
                } | with_entries(select(.value != null))),
                fallback: {
                  body: ("<!-- codex-review-inline-fallback -->\n"
                    + "_Inline comment could not attach to the PR diff — falling back to a thread comment._\n\n"
                    + "📎 `" + $relpath + ":" + $range + "`\n\n"
                    + $core)
                }
              }' "$REVIEW_JSON" > findings.jsonl

          while IFS= read -r combined; do
            inline_payload=$(jq -c '.inline' <<<"$combined")
            fallback_payload=$(jq -c '.fallback' <<<"$combined")

            response_file="$(mktemp)"
            status_code=$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" \
              -d "$inline_payload")

            if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
              echo "::warning::Inline Codex review comment rejected (HTTP ${status_code}); falling back to a thread comment."
              cat "$response_file"

              fallback_response="$(mktemp)"
              fallback_status=$(curl -sS \
                -o "$fallback_response" \
                -w '%{http_code}' \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -d "$fallback_payload")
              if [ "${fallback_status}" -lt 200 ] || [ "${fallback_status}" -ge 300 ]; then
                echo "::warning::Fallback thread comment also failed (HTTP ${fallback_status})."
                cat "$fallback_response"
              fi
              rm -f "$fallback_response"
            fi

            rm -f "$response_file"
          done < findings.jsonl
        shell: bash

      - name: Publish overall summary comment
        if: steps.preflight.outputs.should_run == 'true' && always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_JSON: codex-output.json
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_JSON" ]; then
            echo "Codex output missing; skipping summary."
            exit 0
          fi

          overall_state=$(jq -r '.overall_correctness' "$REVIEW_JSON")
          overall_body=$(jq -r '.overall_explanation' "$REVIEW_JSON")
          confidence=$(jq -r '.overall_confidence_score' "$REVIEW_JSON")
          findings_count=$(jq '.findings | length' "$REVIEW_JSON")
          primary_risk_areas=$(jq -r '.primary_risk_areas | map("`" + . + "`") | join(", ")' "$REVIEW_JSON")
          spec_update_required=$(jq -r '.spec_update_required' "$REVIEW_JSON")
          spec_update_reason=$(jq -r '.spec_update_reason' "$REVIEW_JSON")
          category_breakdown=$(jq -r '
            .findings
            | group_by(.category)
            | map("- `" + .[0].category + "`: " + (length | tostring))
            | join("\n")
          ' "$REVIEW_JSON")
          subsystem_breakdown=$(jq -r '
            .findings
            | group_by(.subsystem)
            | map("- `" + .[0].subsystem + "`: " + (length | tostring))
            | join("\n")
          ' "$REVIEW_JSON")

          comment_body=$(
            jq -n \
              --arg verdict "$overall_state" \
              --arg confidence "$confidence" \
              --arg explanation "$overall_body" \
              --arg findings "$findings_count" \
              --arg risks "$primary_risk_areas" \
              --arg spec_required "$spec_update_required" \
              --arg spec_reason "$spec_update_reason" \
              --arg categories "$category_breakdown" \
              --arg subsystems "$subsystem_breakdown" \
              '{
                body: (
                  "<!-- codex-review-summary -->\n**Codex automated review**\n\n"
                  + "Verdict: " + $verdict + "\n"
                  + "Confidence: " + $confidence + "\n"
                  + "Findings: " + $findings + "\n"
                  + "Primary risk areas: " + (if $risks != "" then $risks else "none" end) + "\n"
                  + "Spec update required: " + $spec_required + (if $spec_required == "true" and $spec_reason != "" then " (" + $spec_reason + ")" else "" end) + "\n\n"
                  + (if $categories != "" then "**Category Breakdown**\n" + $categories + "\n\n" else "" end)
                  + (if $subsystems != "" then "**Subsystem Breakdown**\n" + $subsystems + "\n\n" else "" end)
                  + $explanation
                )
              }'
          )

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$comment_body"
        shell: bash

      - name: Enforce Codex verdict
        if: steps.preflight.outputs.should_run == 'true' && always()
        env:
          REVIEW_JSON: codex-output.json
        run: |
          set -euo pipefail

          if [ "${CODEX_REVIEW_BLOCK_ON_INCORRECT}" != "true" ]; then
            echo "Blocking mode disabled; leaving Codex review advisory."
            exit 0
          fi

          if [ ! -s "$REVIEW_JSON" ]; then
            echo "Codex output missing and blocking mode is enabled."
            exit 1
          fi

          verdict=$(jq -r '.overall_correctness' "$REVIEW_JSON")
          if [ "$verdict" = "patch is incorrect" ]; then
            echo "Codex marked this patch incorrect and blocking mode is enabled."
            exit 1
          fi
        shell: bash

  # Single required-status-check gate. Branch protection points at
  # `CI OK` and this job aggregates every upstream job's result, so
  # adding or renaming jobs never forces a branch-protection edit —
  # just keep the list in `needs:` current.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      - rust-check
      - source-governance
      - typescript
      - sdk-runtime
      - pdf-extractor
      - sdk-integration
      - web-e2e
      - lint-format
      - openapi
      - supply-chain
      - container-security
      - smoke
      - bench
      - nextest
      - coverage
      - contract
      - snapshots
      - codex-review
    if: always()
    steps:
      - name: Enforce required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Upstream job results:"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"

          # `skipped` is allowed — the upstream preflight deliberately
          # skips Codex for draft PRs, forks, and repos without
          # OPENAI_API_KEY, and we don't want those escape hatches to
          # block merges. `failure` or `cancelled` fails the gate.
          bad=$(jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key)
            | join(", ")
          ' <<<"$NEEDS")

          if [ -n "$bad" ]; then
            echo "::error::required checks failed or were cancelled: $bad"
            exit 1
          fi
        shell: bash
