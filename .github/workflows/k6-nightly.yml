name: k6 Nightly Load

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run
        required: true
        default: all
        type: choice
        options:
          - all
          - sustained
          - burst
          - full-load-baseline
          - full-load
      baseline_run_id:
        description: Successful full-load-baseline workflow run ID (required for full-load)
        required: false
        type: string
      pr_number:
        description: Optional PR number for a comparison comment
        required: false
        type: string
  pull_request:
    types:
      - labeled

concurrency:
  group: k6-load-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

env:
  REQUESTED_SCENARIO: ${{ github.event.inputs.scenario || 'all' }}

jobs:
  staging-load:
    name: k6 staging load
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf:regression'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Set up Rust for scale certification
        if: env.REQUESTED_SCENARIO == 'full-load' || env.REQUESTED_SCENARIO == 'full-load-baseline'
        uses: ./.github/actions/setup-rust

      - name: Configure staging target
        env:
          AU_KPIS_STAGING_BASE_URL: ${{ vars.AU_KPIS_STAGING_BASE_URL }}
          AU_KPIS_SCALE_BASE_URL: ${{ vars.AU_KPIS_SCALE_BASE_URL }}
          K6_INFLUXDB_ADDR: ${{ vars.K6_INFLUXDB_ADDR }}
        run: |
          set -euo pipefail
          if [ -z "${AU_KPIS_STAGING_BASE_URL:-}" ]; then
            echo "AU_KPIS_STAGING_BASE_URL repository variable is required for nightly k6." >&2
            exit 1
          fi
          if [ -z "${K6_INFLUXDB_ADDR:-}" ]; then
            echo "K6_INFLUXDB_ADDR repository variable is required for historical k6 load trends." >&2
            exit 1
          fi
          if [[ "${REQUESTED_SCENARIO}" == full-load* ]]; then
            if [ -z "${AU_KPIS_SCALE_BASE_URL:-}" ]; then
              echo "AU_KPIS_SCALE_BASE_URL is required for scale certification." >&2
              exit 1
            fi
            echo "AU_KPIS_BASE_URL=${AU_KPIS_SCALE_BASE_URL}" >> "$GITHUB_ENV"
          else
            echo "AU_KPIS_BASE_URL=${AU_KPIS_STAGING_BASE_URL}" >> "$GITHUB_ENV"
          fi
          echo "K6_OUT=influxdb=${K6_INFLUXDB_ADDR}" >> "$GITHUB_ENV"

      - name: Prepare k6 output directory
        run: mkdir -p target/k6 target/release-scale-report

      - name: Verify deterministic scale dataset
        if: env.REQUESTED_SCENARIO == 'full-load' || env.REQUESTED_SCENARIO == 'full-load-baseline'
        env:
          AU_KPIS_DATABASE_URL: ${{ secrets.AU_KPIS_SCALE_DATABASE_URL }}
        run: |
          cargo run --locked -p au-kpis-testing --bin au-kpis-scale-seed -- \
            --confirm-certification-database \
            --verify-only \
            --manifest target/release-scale-report/seed-manifest.json

      - name: Run sustained load
        id: sustained
        if: env.REQUESTED_SCENARIO == 'all' || env.REQUESTED_SCENARIO == 'sustained'
        continue-on-error: true
        env:
          AU_KPIS_API_KEY: ${{ secrets.AU_KPIS_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          k6 run --out "${K6_OUT}" \
            --summary-export target/k6/sustained-summary.json \
            --tag environment=staging \
            --tag github_run_id="${GITHUB_RUN_ID}" \
            apps/bench/sustained.js

      - name: Run burst load
        id: burst
        if: env.REQUESTED_SCENARIO == 'all' || env.REQUESTED_SCENARIO == 'burst'
        continue-on-error: true
        env:
          AU_KPIS_API_KEY: ${{ secrets.AU_KPIS_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          k6 run --out "${K6_OUT}" \
            --summary-export target/k6/burst-summary.json \
            --tag environment=staging \
            --tag github_run_id="${GITHUB_RUN_ID}" \
            apps/bench/burst.js

      - name: Run full production-v1 workload
        id: full_load
        if: env.REQUESTED_SCENARIO == 'full-load' || env.REQUESTED_SCENARIO == 'full-load-baseline'
        continue-on-error: true
        env:
          AU_KPIS_API_KEY: ${{ secrets.AU_KPIS_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          k6 run --out "${K6_OUT}" \
            --summary-export target/release-scale-report/full-load-summary.json \
            --tag environment=staging \
            --tag github_run_id="${GITHUB_RUN_ID}" \
            apps/bench/full-load.js

      - name: Verify baseline ran with ingestion paused
        if: env.REQUESTED_SCENARIO == 'full-load-baseline'
        env:
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_PROMETHEUS_QUERY_URL: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_QUERY_URL }}
        run: |
          set -euo pipefail
          query='sum(increase(au_kpis_ingestion_jobs_completed_total{environment="staging"}[29m]))'
          result="$(curl --fail --silent --show-error --max-time 30 \
            --user "${GRAFANA_CLOUD_INSTANCE_ID}:${GRAFANA_CLOUD_API_KEY}" \
            --get --data-urlencode "query=${query}" \
            "${GRAFANA_CLOUD_PROMETHEUS_QUERY_URL%/}/api/v1/query")"
          jq -e '.status == "success" and ([.data.result[].value[1] | tonumber] | add // 0) == 0' \
            <<<"${result}" >/dev/null
          jq -n '{status: "passed", ingestion_jobs_completed_during_baseline: 0}' \
            > target/release-scale-report/baseline-ingestion.json

      - name: Download paused-ingestion baseline
        if: env.REQUESTED_SCENARIO == 'full-load'
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${BASELINE_RUN_ID}" || {
            echo "baseline_run_id is required for full-load certification" >&2
            exit 1
          }
          mkdir -p target/release-scale-report/baseline
          gh run download "${BASELINE_RUN_ID}" \
            --name release-scale-baseline \
            --dir target/release-scale-report/baseline

      - name: Run offline Parquet time and heap gates
        if: env.REQUESTED_SCENARIO == 'full-load'
        run: |
          set -euo pipefail
          cargo test --locked -p au-kpis-api-http --release \
            --test parquet_scale -- --ignored --nocapture \
            2>&1 | tee target/release-scale-report/parquet-scale.log
          cargo test --locked -p au-kpis-api-http --release --features dhat-heap \
            --test parquet_memory -- --ignored --nocapture \
            2>&1 | tee target/release-scale-report/parquet-memory.log

      - name: Build production scale report
        id: scale_report
        if: env.REQUESTED_SCENARIO == 'full-load'
        env:
          AU_KPIS_DB_CPU_QUERY: ${{ vars.AU_KPIS_SCALE_DB_CPU_QUERY }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_PROMETHEUS_QUERY_URL: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_QUERY_URL }}
        run: tools/release/build-scale-report.sh

      - name: Upload paused-ingestion scale baseline
        if: always() && env.REQUESTED_SCENARIO == 'full-load-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: release-scale-baseline
          path: target/release-scale-report/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload production scale evidence
        if: always() && env.REQUESTED_SCENARIO == 'full-load'
        uses: actions/upload-artifact@v4
        with:
          name: release-scale-report
          path: target/release-scale-report/**
          if-no-files-found: error
          retention-days: 90

      - name: Download latest nightly baseline
        if: github.event_name == 'pull_request' || github.event.inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/k6/baseline
          baseline_run="$(
            gh run list \
              --workflow k6-nightly.yml \
              --event schedule \
              --status success \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          if [ -n "${baseline_run}" ]; then
            gh run download "${baseline_run}" \
              --name k6-load-summary \
              --dir target/k6/baseline || true
          fi

      - name: Build PR comparison comment
        if: always()
        env:
          K6_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          python3 tools/ci/k6_pr_comment.py \
            --current target/k6 \
            --baseline target/k6/baseline \
            --output target/k6/comment.md \
            --pr "${K6_PR_NUMBER:-}"

      - name: Comment k6 comparison on PR
        if: always() && (github.event_name == 'pull_request' || github.event.inputs.pr_number != '')
        uses: actions/github-script@v8
        env:
          K6_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- k6 load comparison -->'
            const body = fs.readFileSync('target/k6/comment.md', 'utf8')
            const issue_number = Number(process.env.K6_PR_NUMBER)
            if (!issue_number) {
              core.setFailed('A PR number is required for the k6 load comparison comment.')
              return
            }
            const { owner, repo } = context.repo
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

      - name: Upload k6 summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-summary
          path: |
            target/k6/*-summary.json
            target/k6/comment.md
          retention-days: 30

      - name: Fail on k6 threshold regression
        if: steps.sustained.outcome == 'failure' || steps.burst.outcome == 'failure' || steps.full_load.outcome == 'failure'
        run: exit 1
