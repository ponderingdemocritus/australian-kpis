name: Publish SDK

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/actions/setup-node/action.yml"
      - ".github/workflows/sdk-publish.yml"
      - "package.json"
      - "packages/sdk/**"
      - "packages/sdk-generated/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: sdk-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Build SDK packages
        run: pnpm turbo run build --filter=@au-kpis/sdk... --cache-dir=.turbo

      - name: Test SDK packages
        run: pnpm turbo run test --filter=@au-kpis/sdk --cache-dir=.turbo

      - name: Set up npm trusted publishing runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm trusted publishing runtime
        run: |
          node --version
          npm --version
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const nodeVersion = process.versions.node;

          const [nodeMajor] = nodeVersion.split(".").map(Number);
          if (nodeMajor < 24) {
            throw new Error("npm trusted publishing requires Node 24 in this workflow");
          }

          const [npmMajor, npmMinor, npmPatch] = npmVersion.split(".").map(Number);
          if (
            npmMajor < 11 ||
            (npmMajor === 11 && npmMinor < 5) ||
            (npmMajor === 11 && npmMinor === 5 && npmPatch < 1)
          ) {
            throw new Error("npm trusted publishing requires npm >= 11.5.1");
          }
          NODE

      - name: Publish or open SDK release PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:sdk
          title: "chore(sdk): version packages"
          commit: "chore(sdk): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
