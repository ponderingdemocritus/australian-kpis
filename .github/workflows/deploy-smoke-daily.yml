name: Deploy Smoke Daily

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-smoke-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: API, APS, BFF, and webhook smoke
        env:
          AU_KPIS_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          AU_KPIS_BASE_URL: ${{ vars.API_BASE_URL }}
          AU_KPIS_BFF_BASE_URL: ${{ vars.WEB_BASE_URL }}
          AU_KPIS_WEBHOOK_CANARY_URL: ${{ secrets.WEBHOOK_CANARY_URL }}
        run: apps/bench/smoke-post-deploy.sh
