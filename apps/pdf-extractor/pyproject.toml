[project]
name = "au-kpis-pdf-extractor"
version = "0.1.0"
description = "FastAPI sidecar for extracting table candidates from stored Australian budget PDFs."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "camelot-py[cv]>=0.11,<1",
    "fastapi>=0.115,<1",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["au_kpis_pdf_extractor"]
files = ["src"]
